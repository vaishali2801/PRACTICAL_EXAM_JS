<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light body">

    <section class="container mt-5">
        <form id="form" class="card p-4 bg-secondary">
            <h2 class="text-center mb-3 text-light">Task Manager</h2>

            <input type="hidden" id="editIndex" value="-1">

            <input type="text" id="task" class="form-control mb-3" placeholder="Enter task name" required>

            <textarea id="description" class="form-control mb-3" placeholder="Enter task description"
                required></textarea>

            <select id="priority" class="form-select mb-3" required>
                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <button type="submit" class="button-33 w-100">Save Task</button>
        </form>

        <!-- Filter -->
        <div class="mt-4">
            <select id="filterPriority" class="form-select">
                <option value="All">All Tasks</option>
                <option value="High">High Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-responsive mt-4">
            <table class="table table-striped table-light">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Task</th>
                        <th>Description</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTable"></tbody>
            </table>
        </div>

        <div class="alert alert-info mt-3">
            <h5 id="titlesOutput">Task names will appear here</h5>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
